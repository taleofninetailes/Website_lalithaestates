<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Lalitha Estates</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar">

        <a href="index.html" class="logo">

            <div class="logo-icon">
                <!-- Simple house icon -->
                <svg viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path d="M3 10L12 3L21 10V21H3V10Z"
                          stroke="currentColor"
                          stroke-width="2"/>

                    <path d="M9 21V14H15V21"
                          stroke="currentColor"
                          stroke-width="2"/>
                </svg>
            </div>

            <div class="logo-text">
                <span>LALITHA</span>
                <small>ESTATES</small>
            </div>

        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">HOME</a>
            </li>

            <li>
                <a href="Properties.html">PROPERTIES</a>
            </li>

            <li>
                <a href="About.html">ABOUT</a>
            </li>

            <li>
                <a href="Agents.html">AGENTS</a>
            </li>

            <li>
                <a href="Contact.html">CONTACT</a>
            </li>

        </ul>


        <a href="Contact.html" class="nav-button">
            BOOK NOW
        </a>

    </nav>



    <!-- =========================================
         CONTACT PAGE
    ========================================= -->

    <section class="contact-page">

        <!-- PAGE HEADING -->

        <div class="contact-heading">

            <p>CONTACT US</p>

            <h1>GET IN TOUCH</h1>

        </div>


        <!-- CONTACT INFORMATION -->

        <div class="contact-info">

            <h2>Contact Information</h2>

            <p>
                📍 Kurnool, Andhra Pradesh
            </p>

            <p>
                📞 +91 90021 08001
            </p>

            <p>
                ✉ info@prasannaestates.com
            </p>

        </div>


        <!-- CONTACT FORM -->

        <div class="contact-form">

            <h2>SEND AN ENQUIRY</h2>


            <form>

                <!-- Name -->

                <label for="name">Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <!-- Email -->

                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <!-- Phone -->

                <label for="phone">Phone:</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                >


                <!-- Message -->

                <label for="message">Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="4"
                ></textarea>


                <!-- Property -->

                <label for="property">Property:</label>

                <input
                    type="text"
                    id="property"
                    name="property"
                >


                <!-- Submit -->

                <button type="submit">
                    SEND AN ENQUIRY
                </button>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>
        © 2026 Prasanna Estates. All Rights Reserved.
    </footer>

</body>
</html>
